[project]
name = "rag-pipelines"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.4",
    "python-docx>=1.1",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
