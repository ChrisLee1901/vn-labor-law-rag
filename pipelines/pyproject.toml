[project]
name = "rag-pipelines"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.4",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "tokenizers>=0.20",
    "rag-backend",
    "pyarrow>=26.0.1",
    "numpy>=2.5.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
rag-backend = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
