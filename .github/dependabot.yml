version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: uv
    directory: /pipelines
    schedule: { interval: weekly }
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-patch: { update-types: [minor, patch] }
